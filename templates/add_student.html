{% extends "base.html" %}
{% block title %}Add Student - SRMS{% endblock %}

{% block content %}
<div class="page-header">
    <h2><i class="bi bi-person-plus-fill"></i> Add New Student</h2>
    <p class="text-muted">Enter student details to add a new record to students.xml</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('add_student_page') }}" id="addStudentForm" novalidate>
                    <!-- Student ID -->
                    <div class="mb-3">
                        <label for="student_id" class="form-label">
                            <i class="bi bi-hash me-1"></i> Student ID <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="student_id" name="student_id"
                               placeholder="e.g. 103" required>
                        <div class="invalid-feedback">Please enter a Student ID.</div>
                    </div>

                    <!-- Student Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            <i class="bi bi-person me-1"></i> Student Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="name" name="name"
                               placeholder="e.g. Sneha V P" required>
                        <div class="invalid-feedback">Please enter the student name.</div>
                    </div>

                    <!-- Course -->
                    <div class="mb-3">
                        <label for="course" class="form-label">
                            <i class="bi bi-book me-1"></i> Course <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="course" name="course"
                               placeholder="e.g. M.Tech CSE" required>
                        <div class="invalid-feedback">Please enter the course.</div>
                    </div>

                    <!-- Semester -->
                    <div class="mb-3">
                        <label for="semester" class="form-label">
                            <i class="bi bi-calendar3 me-1"></i> Semester <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="semester" name="semester"
                               placeholder="e.g. 1" required>
                        <div class="invalid-feedback">Please enter the semester.</div>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-plus-circle me-2"></i> Add Student
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
